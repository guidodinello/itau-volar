[project]
name = "itau-volar-cli"
version = "0.1.0"
description = "Personal CLI to browse and compare Itaú Volar and Tienda Volar products"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "logger",
]

[project.scripts]
volar = "itau_volar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itau_volar"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.uv.sources]
# Tracks logger's main branch; uv.lock pins the exact commit. Pick up a newer
# logger with `uv lock --upgrade-package logger`.
logger = { git = "https://github.com/guidodinello/logger", branch = "main" }
